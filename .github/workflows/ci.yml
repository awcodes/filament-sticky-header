name: CI

# Canonical caller for a Filament plugin, on the shared reusable workflows in
# awcodes/.github (docs/package-migration.md).
#
# 4.x is the active branch and serves both supported Filament majors from one branch —
# composer.json requires "filament/filament": "^4.0|^5.0" — so one caller covers both:
# the matrix pins filament/filament per row and the shared workflow installs that pin
# before running the suite. Without the per-row pin every row would resolve Filament 5
# under prefer-stable and the ^4.0 half of the constraint would never be executed.
#
# 1.x / 2.x / 3.x are frozen and keep whatever CI they already have.

on:
  push:
    branches:
      - 4.x
    paths:
      - "src/**"
      - "config/**"
      - "database/**"
      - "resources/**"
      - "routes/**"
      - "tests/**"
      - "composer.json"
      - "package.json"
      - "package-lock.json"
      - "vite.config.*"
      - "phpunit.xml*"
      - "phpstan.neon*"
      - "rector.php"
      - "pint.json"
      - ".github/workflows/**"
  pull_request:
    branches:
      - 4.x
    paths:
      - "src/**"
      - "config/**"
      - "database/**"
      - "resources/**"
      - "routes/**"
      - "tests/**"
      - "composer.json"
      - "package.json"
      - "package-lock.json"
      - "vite.config.*"
      - "phpunit.xml*"
      - "phpstan.neon*"
      - "rector.php"
      - "pint.json"
      - ".github/workflows/**"

jobs:
  ci:
    uses: awcodes/.github/.github/workflows/filament-plugin.yml@v1
    with:
      # Explicit rows, no `exclude`. All seven resolve against this package's transitive
      # constraints: the F5 rows land filament 5.8.1, the F4 rows filament 4.13.1.
      matrix: |
        [
          {"php":"8.5","laravel":"13.*","filament":"5.*","testbench":"11.*","dependencies":"prefer-stable"},
          {"php":"8.4","laravel":"13.*","filament":"5.*","testbench":"11.*","dependencies":"prefer-stable"},
          {"php":"8.5","laravel":"12.*","filament":"5.*","testbench":"10.*","dependencies":"prefer-stable"},
          {"php":"8.4","laravel":"12.*","filament":"5.*","testbench":"10.*","dependencies":"prefer-stable"},
          {"php":"8.3","laravel":"12.*","filament":"5.*","testbench":"10.*","dependencies":"prefer-stable"},
          {"php":"8.4","laravel":"12.*","filament":"4.*","testbench":"10.*","dependencies":"prefer-stable"},
          {"php":"8.3","laravel":"12.*","filament":"4.*","testbench":"10.*","dependencies":"prefer-stable"}
        ]
      # filament-package is left at its default. This is a panel plugin: its runtime
      # require is filament/filament, so the matrix pins the package it depends on.
      run-tests: true
      run-lint: true
      run-static-analysis: true
      run-reformat: true
      # The suite does not need the compiled bundle. StickyHeaderServiceProvider only
      # hands resources/dist/sticky-header.js to FilamentAsset::register(), which stores
      # the path — nothing reads the file, and the suite passes with it deleted. So there
      # is no reason to spend a Node setup and build on every matrix row. Freshness of the
      # committed bundle is checked once, in the `assets` job below.
      run-build: false

  # resources/dist is committed and shipped, so a change to resources/js that lands
  # without a rebuild silently publishes stale assets. The build is deterministic, so
  # rebuilding and diffing catches that on the PR rather than after a tag is cut.
  # (The shared workflow's run-build input is a different thing: it builds assets for
  # suites that need them, and checks nothing.)
  #
  # This replaces the old assets.yml, which rebuilt and auto-committed after merge — so
  # main could hold a stale bundle for as long as it took that job to run, and the diff
  # was never reviewed.
  assets:
    name: Assets
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build assets
        run: npm run build

      - name: Check that dist is current
        run: |
          if [ -n "$(git status --porcelain -- resources/dist)" ]; then
            echo "::error::resources/dist is out of date. Run 'npm run build' and commit the result."
            git --no-pager diff --stat -- resources/dist
            git status --porcelain -- resources/dist
            exit 1
          fi
